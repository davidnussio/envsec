name: Release & Publish

on:
  release:
    # "published" (not "created"): saving a draft release must not publish
    types: [published]

jobs:
  # Built and smoke-tested on native runners before anything is published,
  # so a broken binary blocks the whole release.
  binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            targets: bun-linux-x64 bun-linux-arm64 bun-linux-x64-musl bun-linux-arm64-musl
            smoke: envsec-linux-x64
          - os: macos-latest
            targets: bun-darwin-arm64 bun-darwin-x64
            smoke: envsec-darwin-arm64
          - os: windows-latest
            targets: bun-windows-x64
            smoke: envsec-windows-x64.exe
    runs-on: ${{ matrix.os }}
    name: Binaries (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v7

      # The binary embeds the CLI version at compile time (build-info.ts).
      - name: Set CLI version from tag
        shell: bash
        working-directory: packages/cli
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - uses: ./.github/actions/setup-and-build

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Compile
        shell: bash
        run: pnpm -F envsec run build:bin ${{ matrix.targets }}

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: |
          for f in packages/cli/release/envsec-darwin-*; do
            [[ "$f" == *.map ]] && continue
            codesign --force --sign - "$f"
            codesign --verify --verbose "$f"
          done

      - name: Smoke test
        shell: bash
        run: |
          BIN="packages/cli/release/${{ matrix.smoke }}"
          export ENVSEC_DB="$RUNNER_TEMP/smoke/store.sqlite"
          "$BIN" --version | grep -qF "${GITHUB_REF_NAME#v}"
          "$BIN" cmd list

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ runner.os }}
          path: |
            packages/cli/release/envsec-*
            !packages/cli/release/*.map
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Determine npm dist-tag: only stable versions become "latest"
          if [[ "$VERSION" == *"-alpha"* ]]; then
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *"-beta"* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *"-"* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # Fail before publishing anything, so a release is never half-published.
      # npm's `time` field also lists versions that were published and later
      # unpublished: npm never allows reusing those numbers either.
      - name: Check that no version is already taken on npm
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for pkg in @envsec/core @envsec/sdk @envsec/tui envsec; do
            if npm view "$pkg" time --json 2>/dev/null | node -e '
              const t = JSON.parse(require("fs").readFileSync(0, "utf8") || "{}");
              process.exit(Object.hasOwn(t, process.argv[1]) ? 0 : 1);
            ' "$VERSION"; then
              echo "::error::$pkg@$VERSION is already taken on npm (published now or in the past)"
              exit 1
            fi
          done

      - name: Bump versions in package.json files
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # CLI gets the full version
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('packages/cli/package.json', 'utf8'));
            pkg.version = '${VERSION}';
            fs.writeFileSync('packages/cli/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          # Core, SDK, and TUI get the same version (linked)
          for dir in packages/core packages/sdk packages/tui; do
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('${dir}/package.json', 'utf8'));
              pkg.version = '${VERSION}';
              fs.writeFileSync('${dir}/package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
          done

      - uses: ./.github/actions/setup-and-build
        with:
          registry-url: "https://registry.npmjs.org"

      - name: Publish @envsec/core to npm
        run: pnpm -F @envsec/core publish --no-git-checks --tag ${{ steps.version.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @envsec/sdk to npm
        run: pnpm -F @envsec/sdk publish --no-git-checks --tag ${{ steps.version.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @envsec/tui to npm
        run: pnpm -F @envsec/tui publish --no-git-checks --tag ${{ steps.version.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish envsec CLI to npm
        run: pnpm -F envsec publish --no-git-checks --tag ${{ steps.version.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/cli/package.json packages/core/package.json packages/sdk/package.json packages/tui/package.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: bump version to ${VERSION}"
          git push origin HEAD:main

  attach-binaries:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: bin
          merge-multiple: true

      # Asset names carry no version, so releases/latest/download/<asset> is a
      # stable URL. Artifacts lose the executable bit: it is restored here.
      - name: Package archives and checksums
        run: |
          OUT="$PWD/release-assets"
          mkdir -p "$OUT"
          for f in bin/envsec-*; do
            name="$(basename "$f")"
            target="${name#envsec-}"
            target="${target%.exe}"
            stage="$(mktemp -d)"
            cp LICENSE README.md "$stage/"
            if [[ "$name" == *.exe ]]; then
              cp "$f" "$stage/envsec.exe"
              (cd "$stage" && zip -q "$OUT/envsec-${target}.zip" envsec.exe LICENSE README.md)
            else
              install -m 755 "$f" "$stage/envsec"
              tar -C "$stage" -czf "$OUT/envsec-${target}.tar.gz" envsec LICENSE README.md
            fi
          done
          (cd "$OUT" && sha256sum envsec-* > SHA256SUMS)
          cat "$OUT/SHA256SUMS"

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber

  # The formula installs the prebuilt binaries attached above: no Node.js.
  homebrew-formula:
    needs: attach-binaries
    # Homebrew tracks stable releases only
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Generate formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS

          sha() {
            local hash
            hash="$(awk -v f="envsec-$1.tar.gz" '$2 == f { print $1 }' SHA256SUMS)"
            if [ -z "$hash" ]; then
              echo "::error::No checksum for envsec-$1.tar.gz" >&2
              exit 1
            fi
            echo "$hash"
          }
          DARWIN_ARM64="$(sha darwin-arm64)"
          DARWIN_X64="$(sha darwin-x64)"
          LINUX_ARM64="$(sha linux-arm64)"
          LINUX_X64="$(sha linux-x64)"

          cat > envsec.rb << EOF
          class Envsec < Formula
            desc "Secure environment secrets management using native OS credential stores"
            homepage "https://github.com/davidnussio/envsec"
            version "$VERSION"
            license "MIT"

            on_macos do
              on_arm do
                url "$BASE/envsec-darwin-arm64.tar.gz"
                sha256 "$DARWIN_ARM64"
              end
              on_intel do
                url "$BASE/envsec-darwin-x64.tar.gz"
                sha256 "$DARWIN_X64"
              end
            end

            on_linux do
              on_arm do
                url "$BASE/envsec-linux-arm64.tar.gz"
                sha256 "$LINUX_ARM64"
              end
              on_intel do
                url "$BASE/envsec-linux-x64.tar.gz"
                sha256 "$LINUX_X64"
              end
            end

            def install
              bin.install "envsec"
              generate_completions_from_executable(bin/"envsec", "--completions", shells: [:bash, :zsh, :fish])
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/envsec --version")
              shell_output("ENVSEC_DB=#{testpath}/store.sqlite #{bin}/envsec cmd list")
            end
          end
          EOF

          sed -i 's/^          //' envsec.rb
          cat envsec.rb

      - uses: actions/upload-artifact@v7
        with:
          name: homebrew-formula
          path: envsec.rb
          retention-days: 7

  # Install the generated formula for real before it reaches the tap.
  homebrew-test:
    needs: homebrew-formula
    strategy:
      matrix:
        os: [macos-latest, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    name: Homebrew install (${{ matrix.os }})
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: homebrew-formula

      - name: Install and test
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            if [ ! -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
              NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            fi
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          brew tap-new --no-git envsec/release-test
          cp envsec.rb "$(brew --repository envsec/release-test)/Formula/envsec.rb"
          brew install envsec/release-test/envsec
          brew test envsec/release-test/envsec
          envsec --version
          test -f "$(brew --prefix)/share/zsh/site-functions/_envsec"

  update-homebrew:
    needs: homebrew-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: homebrew-formula

      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: davidnussio/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Commit and push
        working-directory: homebrew-tap
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp ../envsec.rb Formula/envsec.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/envsec.rb
          git commit -m "envsec ${VERSION}"
          git push
